<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Techify</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">⚡ <span>Techify</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><button id="theme-toggle" class="theme-toggle-btn">☀️ Light Mode</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Contact Us</h1>
      <p>Have questions or feedback? Drop us a line below.</p>
    </div>

    <div class="form-container">
      <div id="form-alert" class="alert alert-success"></div>

      <form id="contact-form">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" class="form-control" placeholder="Feature Request or Git Inquiry" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" class="form-control" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; <span id="current-year">2026</span> Techify Inc. Built for Git practice.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
